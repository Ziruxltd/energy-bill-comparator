[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  framework = "#custom" # skips the monorepo "which project?" prompt
  command = "pnpm --filter @ebc/web dev"
  targetPort = 5173
